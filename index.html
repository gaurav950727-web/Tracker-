<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#172554">

<title>Revision Checklist</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{

    background:#f4f7fb;

    color:#172033;

    padding:12px;

}

.container{

    max-width:1100px;

    margin:auto;

}


/* =========================
   HEADER
========================= */

.header{

    background:
    linear-gradient(
        135deg,
        #111b55,
        #1749b8
    );

    color:white;

    padding:25px 18px;

    border-radius:20px;

    text-align:center;

    margin-bottom:15px;

}

.header h1{

    font-size:28px;

    margin-bottom:7px;

}

.header p{

    opacity:.9;

}


/* =========================
   STAT CARDS
========================= */

.stats{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:10px;

    margin-bottom:15px;

}

.stat{

    background:white;

    padding:16px 8px;

    border-radius:15px;

    text-align:center;

    box-shadow:
    0 4px 15px
    rgba(0,0,0,.07);

}

.stat .icon{

    font-size:25px;

}

.stat h2{

    font-size:22px;

    margin:4px 0;

}

.stat p{

    font-size:12px;

    color:#667085;

}


/* =========================
   PROGRESS
========================= */

.progress-box{

    background:white;

    padding:17px;

    border-radius:16px;

    margin-bottom:15px;

    box-shadow:
    0 4px 15px
    rgba(0,0,0,.07);

}

.progress-top{

    display:flex;

    justify-content:
    space-between;

    margin-bottom:8px;

    font-weight:bold;

}

.progress{

    height:12px;

    background:#e6eaf0;

    border-radius:20px;

    overflow:hidden;

}

.progress-bar{

    height:100%;

    width:0%;

    background:
    linear-gradient(
        90deg,
        #2764ff,
        #22c55e
    );

    transition:.3s;

}


/* =========================
   SUCCESS
========================= */

.success{

    display:none;

    background:
    linear-gradient(
        135deg,
        #15803d,
        #22c55e
    );

    color:white;

    padding:22px;

    border-radius:18px;

    text-align:center;

    margin-bottom:15px;

}

.success h2{

    margin-bottom:6px;

}


/* =========================
   DAY CARD
========================= */

.day{

    background:white;

    border-radius:18px;

    margin-bottom:17px;

    overflow:hidden;

    box-shadow:
    0 4px 15px
    rgba(0,0,0,.07);

}

.day-header{

    background:#101a4f;

    color:white;

    padding:15px 17px;

    display:flex;

    justify-content:
    space-between;

    align-items:center;

}

.day-header h2{

    font-size:19px;

}

.day-progress{

    font-size:12px;

    opacity:.9;

}


/* =========================
   SUBJECTS
========================= */

.subjects{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:12px;

    padding:14px;

}


/* =========================
   SUBJECT CARD
========================= */

.subject{

    border:2px solid #e8ebf0;

    border-radius:15px;

    padding:14px;

    min-height:180px;

}

.subject h3{

    font-size:17px;

    margin-bottom:8px;

}

.subject-meta{

    font-size:12px;

    color:#667085;

    margin-bottom:10px;

}


/* =========================
   TOPIC
========================= */

.topic{

    display:flex;

    align-items:center;

    gap:8px;

    padding:8px 0;

    border-bottom:
    1px solid #eeeeee;

}

.topic input{

    width:18px;

    height:18px;

    cursor:pointer;

}

.topic span{

    flex:1;

    font-size:14px;

    overflow-wrap:anywhere;

}

.topic.completed span{

    text-decoration:
    line-through;

    color:#8b95a5;

}


/* DELETE */

.delete{

    border:none;

    background:none;

    color:#ef4444;

    cursor:pointer;

    font-size:15px;

}


/* =========================
   ADD TOPIC
========================= */

.add-topic{

    display:flex;

    gap:6px;

    margin-top:11px;

}

.add-topic input{

    width:100%;

    border:
    1px solid #d8dde6;

    border-radius:8px;

    padding:8px;

    outline:none;

}

.add-topic input:focus{

    border-color:#1749b8;

}

.add-topic button{

    border:none;

    background:#1749b8;

    color:white;

    border-radius:8px;

    padding:0 13px;

    cursor:pointer;

}


/* =========================
   ADD DAY
========================= */

.add-day{

    width:100%;

    padding:14px;

    border:none;

    border-radius:14px;

    background:#172554;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    margin-bottom:12px;

}


/* =========================
   RESET
========================= */

.reset{

    width:100%;

    padding:13px;

    border:none;

    border-radius:12px;

    background:#fee2e2;

    color:#b91c1c;

    font-weight:bold;

    cursor:pointer;

    margin-bottom:25px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .stats{

        grid-template-columns:
        repeat(2,1fr);

    }

    .subjects{

        grid-template-columns:1fr;

    }

    .header h1{

        font-size:23px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- HEADER -->

<div class="header">

<h1>
📚 7-DAY REVISION CHECKLIST
</h1>

<p>
3 Subjects • 1 Hour Daily •
Learn → Recall → Practice → Review
</p>

</div>


<!-- STATS -->

<div class="stats">


<div class="stat">

<div class="icon">🔥</div>

<h2 id="streak">
0
</h2>

<p>
Day Streak
</p>

</div>


<div class="stat">

<div class="icon">✅</div>

<h2 id="completed">
0
</h2>

<p>
Completed
</p>

</div>


<div class="stat">

<div class="icon">📚</div>

<h2 id="total">
0
</h2>

<p>
Total Topics
</p>

</div>


<div class="stat">

<div class="icon">🏆</div>

<h2 id="percentage">
0%
</h2>

<p>
Progress
</p>

</div>


</div>


<!-- PROGRESS -->

<div class="progress-box">


<div class="progress-top">

<span>
Overall Progress
</span>

<span id="progressText">
0%
</span>

</div>


<div class="progress">

<div
class="progress-bar"
id="progressBar">
</div>

</div>


</div>


<!-- SUCCESS -->

<div
class="success"
id="successBox">

<h2>
🏆 ALL TOPICS COMPLETED!
</h2>

<p>
Excellent! You completed your
entire revision plan.
</p>

</div>


<!-- DAYS -->

<div id="days"></div>


<!-- ADD DAY -->

<button
class="add-day"
onclick="addDay()">

➕ ADD ANOTHER DAY

</button>


<!-- RESET -->

<button
class="reset"
onclick="resetAll()">

🗑️ RESET EVERYTHING

</button>


</div>



<script>


/* =========================
   DEFAULT TOPICS
========================= */

const defaultData = [

{

day:"DAY 1",

subjects:[

{

name:"PHYSICS",

topics:[

"Light – Reflection Basics",

"Mirror Terms"

]

},

{

name:"CHEMISTRY",

topics:[

"Chemical Reactions",

"Types of Reactions"

]

},

{

name:"BIOLOGY",

topics:[

"Nutrition",

"Important Definitions"

]

}

]

},


{

day:"DAY 2",

subjects:[

{

name:"MATHEMATICS",

topics:[

"Real Numbers",

"Euclid's Division Lemma"

]

},

{

name:"SST – HISTORY",

topics:[

"Important Events",

"Timeline"

]

},

{

name:"ENGLISH",

topics:[

"Literature – 1 Chapter",

"Summary + Characters"

]

}

]

},


{

day:"DAY 3",

subjects:[

{

name:"PHYSICS",

topics:[

"Ray Diagrams",

"Spherical Mirrors"

]

},

{

name:"CHEMISTRY",

topics:[

"Balancing Equations",

"Reaction Observations"

]

},

{

name:"BIOLOGY",

topics:[

"Respiration",

"Transportation"

]

}

]

},


{

day:"DAY 4",

subjects:[

{

name:"MATHEMATICS",

topics:[

"Polynomials",

"Zeroes of a Polynomial"

]

},

{

name:"SST – GEOGRAPHY",

topics:[

"Resources",

"Important Terms"

]

},

{

name:"HINDI",

topics:[

"Chapter Summary",

"Important Questions"

]

}

]

},


{

day:"DAY 5",

subjects:[

{

name:"PHYSICS",

topics:[

"Mirror Formula",

"Magnification"

]

},

{

name:"CHEMISTRY",

topics:[

"Acids, Bases & Salts",

"pH Scale"

]

},

{

name:"BIOLOGY",

topics:[

"Transportation",

"Excretion"

]

}

]

},


{

day:"DAY 6",

subjects:[

{

name:"MATHEMATICS",

topics:[

"Pair of Linear Equations",

"Graphical Method"

]

},

{

name:"SST – CIVICS",

topics:[

"Power Sharing",

"Key Concepts"

]

},

{

name:"ENGLISH / HINDI",

topics:[

"Grammar Rules",

"Grammar Questions"

]

}

]

},


{

day:"DAY 7",

subjects:[

{

name:"WEEKLY REVISION",

topics:[

"Revise Science Topics",

"Revise Important Diagrams"

]

},

{

name:"MATHEMATICS",

topics:[

"Solve 5 Questions",

"Check Mistakes"

]

},

{

name:"SST + LANGUAGES",

topics:[

"Recall Key Points",

"Revise Important Questions"

]

}

]

}

];



/* =========================
   LOAD DATA
========================= */

let data =
JSON.parse(
localStorage.getItem(
"revisionData"
)
);


if(!data){

data =
defaultData.map(day => ({

...day,

subjects:
day.subjects.map(subject => ({

...subject,

topics:
subject.topics.map(topic => ({

text:topic,

done:false

}))

}))

}));

}



/* =========================
   SAVE
========================= */

function save(){

localStorage.setItem(

"revisionData",

JSON.stringify(data)

);

}



/* =========================
   RENDER
========================= */

function render(){

const container =
document.getElementById("days");


container.innerHTML="";


data.forEach(

(day,dayIndex)=>{


let totalDay=0;

let doneDay=0;


day.subjects.forEach(

subject=>{

subject.topics.forEach(

topic=>{

totalDay++;

if(topic.done){

doneDay++;

}

}

);

}

);


const dayBox =
document.createElement("div");


dayBox.className="day";


dayBox.innerHTML=`


<div class="day-header">

<h2>
📅 ${day.day}
</h2>

<div class="day-progress">

${doneDay}/${totalDay}
completed

</div>

</div>


<div class="subjects">


${

day.subjects.map(

(subject,subjectIndex)=>`


<div class="subject">


<h3>
${subject.name}
</h3>


<div class="subject-meta">

⏱️ 20 MIN

</div>


${

subject.topics.map(

(topic,topicIndex)=>`


<div class="topic
${topic.done
?"completed"
:""}">


<input

type="checkbox"

${topic.done
?"checked"
:""}

onchange="

toggleTopic(

${dayIndex},

${subjectIndex},

${topicIndex}

)

"

>


<span>

${topic.text}

</span>


<button

class="delete"

onclick="

deleteTopic(

${dayIndex},

${subjectIndex},

${topicIndex}

)

">

✕

</button>


</div>


`

).join("")

}


<div class="add-topic">


<input

id="input-${dayIndex}-${subjectIndex}"

placeholder="Add topic..."

onkeydown="

if(event.key==='Enter')

addTopic(

${dayIndex},

${subjectIndex}

)

"


>


<button

onclick="

addTopic(

${dayIndex},

${subjectIndex}

)

">

+

</button>


</div>


</div>


`

).join("")

}


</div>

`;


container.appendChild(dayBox);


}

);


updateStats();

}



/* =========================
   ADD TOPIC
========================= */

function addTopic(

dayIndex,

subjectIndex

){


const input =
document.getElementById(

`input-${dayIndex}-${subjectIndex}`

);


const text =
input.value.trim();


if(!text)return;


data[dayIndex]

.subjects[subjectIndex]

.topics.push({

text:text,

done:false

});


save();

render();


}



/* =========================
   DELETE
========================= */

function deleteTopic(

dayIndex,

subjectIndex,

topicIndex

){


if(

!confirm(
"Delete this topic?"
)

)return;


data[dayIndex]

.subjects[subjectIndex]

.topics.splice(

topicIndex,

1

);


save();

render();


}



/* =========================
   CHECK / UNCHECK
========================= */

function toggleTopic(

dayIndex,

subjectIndex,

topicIndex

){


data[dayIndex]

.subjects[subjectIndex]

.topics[topicIndex]

.done =

!data[dayIndex]

.subjects[subjectIndex]

.topics[topicIndex]

.done;


save();

render();


}



/* =========================
   ADD DAY
========================= */

function addDay(){


const number =
data.length+1;


data.push({

day:
"DAY "+number,

subjects:[

{

name:"SUBJECT 1",

topics:[]

},

{

name:"SUBJECT 2",

topics:[]

},

{

name:"SUBJECT 3",

topics:[]

}

]

});


save();

render();


}



/* =========================
   STATISTICS
========================= */

function updateStats(){


let total=0;

let completed=0;


data.forEach(

day=>{

day.subjects.forEach(

subject=>{

subject.topics.forEach(

topic=>{

total++;


if(topic.done){

completed++;

}

}

);

}

);

}


);


let percentage =

total===0

?0

:Math.round(

completed/total*100

);


document.getElementById(
"total"
).textContent=total;


document.getElementById(
"completed"
).textContent=completed;


document.getElementById(
"percentage"
).textContent=
percentage+"%";


document.getElementById(
"progressText"
).textContent=
percentage+"%";


document.getElementById(
"progressBar"
).style.width=
percentage+"%";


if(

total>0 &&
completed===total

){

document.getElementById(
"successBox"
).style.display=
"block";

}

else{

document.getElementById(
"successBox"
).style.display=
"none";

}


}



/* =========================
   RESET
========================= */

function resetAll(){


if(

!confirm(

"Delete all saved revision data?"

)

)return;


localStorage.removeItem(
"revisionData"
);


location.reload();


}



/* =========================
   START
========================= */

render();


</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(() => console.log("Service Worker registered"))
      .catch((error) => console.error("Service Worker failed:", error));
  });
}
</script>

</body>

  </html>
